<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - FLUENT</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div class="header-stripe"></div>

  <nav>
    <a href="../index.html" class="nav-logo">FLUENT</a>
    <div class="nav-links">
      <span id="nav-user" class="hidden" style="color: var(--tan); font-size: 0.9rem;"></span>
      <a href="languages.html">Languages</a>
      <a id="nav-login" href="login.html">Log In</a>
      <a id="nav-register" href="register.html" class="btn-nav">Sign Up</a>
      <a id="nav-logout" href="#" class="hidden" onclick="logout()">Log Out</a>
    </div>
  </nav>

  <div class="form-card">
    <h2>Create Account</h2>
    <p class="subtitle">Join FLUENT and start learning today.</p>

    <div id="msg" class="msg hidden"></div>

    <div class="form-group">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" placeholder="Your name" />
    </div>

    <div class="form-group">
      <label for="username">Username <span style="color:var(--error)">*</span></label>
      <input type="text" id="username" placeholder="Pick a username" />
    </div>

    <div class="form-group">
      <label for="email">Email <span style="color:var(--error)">*</span></label>
      <input type="email" id="email" placeholder="your@email.com" />
    </div>

    <div class="form-group">
      <label for="birthday">Birthday</label>
      <input type="date" id="birthday" />
    </div>

    <div class="form-group">
      <label for="password">Password <span style="color:var(--error)">*</span></label>
      <input type="password" id="password" placeholder="At least 6 characters" />
    </div>

    <button class="btn btn-primary" style="width:100%; margin-top: 0.5rem;" onclick="handleRegister()">Create Account</button>

    <p style="text-align:center; margin-top: 1rem; font-size: 0.88rem; color: var(--gray);">
      Already have an account? <a href="login.html" style="color: var(--teal);">Log in</a>
    </p>
  </div>

  <script src="../js/app.js"></script>
  <script>
    async function handleRegister() {
      var username = document.getElementById('username').value.trim();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var full_name = document.getElementById('full_name').value.trim();
      var birthday = document.getElementById('birthday').value;

      if (!username || !email || !password) {
        showMsg('msg', 'Username, email, and password are required.', 'error');
        return;
      }

      if (password.length < 6) {
        showMsg('msg', 'Password needs to be at least 6 characters.', 'error');
        return;
      }

      try {
        const res = await fetch(API + '/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, email: email, password: password, full_name: full_name, birthday: birthday || null })
        });

        const data = await res.json();

        if (!res.ok) {
          showMsg('msg', data.error || 'Registration failed.', 'error');
          return;
        }

        showMsg('msg', 'Account created! Redirecting to login...', 'success');
        setTimeout(function() { window.location.href = 'login.html'; }, 1500);

      } catch (err) {
        showMsg('msg', 'Could not connect to server. Is it running?', 'error');
      }
    }
  </script>

</body>
</html>
