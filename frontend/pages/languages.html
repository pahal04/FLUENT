<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Languages - FLUENT</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div class="header-stripe"></div>

  <nav>
    <a href="../index.html" class="nav-logo">FLUENT</a>
    <div class="nav-links">
      <span id="nav-user" class="hidden" style="color: var(--tan); font-size: 0.9rem;"></span>
      <a href="languages.html">Languages</a>
      <a href="progress.html">My Progress</a>
      <a id="nav-login" href="login.html">Log In</a>
      <a id="nav-register" href="register.html" class="btn-nav">Sign Up</a>
      <a id="nav-logout" href="#" class="hidden" onclick="logout()">Log Out</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <!-- gets updated by JS if language is preselected in the URL -->
      <h2 id="page-title">Browse Scenarios</h2>
      <p id="page-subtitle">Click a language below to see its scenarios.</p>
    </div>

    <!-- language cards load here -->
    <div id="lang-grid" class="lang-grid"></div>

    <!-- scenario cards load here after a language is selected -->
    <div id="scenario-grid" class="grid-3"></div>
  </div>

  <footer>
    <p>FLUENT &copy; 2026 &middot; IS 436 &middot; UMBC</p>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // check if a language was pre-selected (coming from homepage)
      var params = new URLSearchParams(window.location.search);
      var langId = params.get('lang_id');
      var langName = params.get('lang_name');

      loadLanguages('lang-grid');

      if (langId && langName) {
        // update page title and load that language's scenarios right away
        document.getElementById('page-title').textContent = langName + ' Scenarios';
        document.getElementById('page-subtitle').textContent = 'Practice real-world conversations in ' + langName + '.';
        loadScenarios('scenario-grid', langId);

        // highlight the selected language card after cards load
        setTimeout(function() {
          var card = document.querySelector('.lang-card[data-id="' + langId + '"]');
          if (card) card.classList.add('selected');
        }, 400);
      } else {
        // no language selected yet - load all scenarios
        loadScenarios('scenario-grid', null);
      }
    });

    // override selectLanguage so clicking a card also updates the heading
    var originalSelectLanguage = selectLanguage;
    selectLanguage = function(card, langId, langName) {
      originalSelectLanguage(card, langId, langName);
      document.getElementById('page-title').textContent = langName + ' Scenarios';
      document.getElementById('page-subtitle').textContent = 'Practice real-world conversations in ' + langName + '.';
      history.pushState({}, '', '?lang_id=' + langId + '&lang_name=' + langName);
    };
  </script>

</body>
</html>
