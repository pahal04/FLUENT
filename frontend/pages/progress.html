<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Progress - FLUENT</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .summary-bar {
      background: var(--brown);
      color: var(--white);
      padding: 1.5rem 0;
    }
    .summary-bar .inner {
      display: flex;
      gap: 2.5rem;
      align-items: center;
    }
    .summary-bar .stat .num {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--teal);
    }
    .summary-bar .stat .lbl {
      font-size: 0.8rem;
      color: var(--tan);
    }
  </style>
</head>
<body>

  <div class="header-stripe"></div>

  <nav>
    <a href="../index.html" class="nav-logo">FLUENT</a>
    <div class="nav-links">
      <span id="nav-user" class="hidden" style="color: var(--tan); font-size: 0.9rem;"></span>
      <a href="languages.html">Languages</a>
      <a href="progress.html">My Progress</a>
      <a id="nav-login" href="login.html">Log In</a>
      <a id="nav-register" href="register.html" class="btn-nav">Sign Up</a>
      <a id="nav-logout" href="#" class="hidden" onclick="logout()">Log Out</a>
    </div>
  </nav>

  <!-- summary stats bar at the top (only shows when logged in) -->
  <div id="summary-bar" class="summary-bar hidden">
    <div class="container">
      <div class="inner">
        <!-- numbers are filled in by JS after getting the progress -->
        <div class="stat">
          <div class="num" id="total-completed">0</div>
          <div class="lbl">Scenarios Completed</div>
        </div>
        <div class="stat">
          <div class="num" id="total-languages">0</div>
          <div class="lbl">Languages Practiced</div>
        </div>
        <div class="stat">
          <div class="num" id="avg-confidence">-</div>
          <div class="lbl">Avg. Confidence</div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="page-header">
      <h2>My Progress</h2>
      <p id="progress-subtitle">Track your completed scenarios and confidence ratings.</p>
    </div>

    <!-- progress list or message goes here -->
    <div id="progress-list"></div>

    <!-- shown if not logged in -->
    <div id="not-logged-in" class="hidden" style="text-align: center; padding: 3rem 0; color: var(--gray);">
      <p style="font-size: 1.1rem; margin-bottom: 1rem;">You need to be logged in to see your progress.</p>
      <a href="login.html" class="btn btn-primary" style="margin-right: 0.75rem;">Log In</a>
      <a href="register.html" class="btn btn-outline">Sign Up</a>
    </div>
  </div>

  <footer>
    <p>FLUENT &copy; 2026 &middot; IS 436 &middot; UMBC</p>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      var user = getUser();

      if (!user) {
        document.getElementById('not-logged-in').classList.remove('hidden');
        document.getElementById('progress-subtitle').textContent = 'Log in to track your learning progress.';
        return;
      }

      document.getElementById('summary-bar').classList.remove('hidden');

      try {
        var res = await fetch(API + '/progress/' + user.user_id);
        var completions = await res.json();

        if (completions.length === 0) {
          document.getElementById('progress-list').innerHTML =
            '<p style="color: var(--gray); text-align: center; padding: 2rem 0;">No completed scenarios yet. <a href="languages.html">Browse scenarios to get started!</a></p>';
          return;
        }

        // count unique languages
        var langsSeen = [];
        for (var i = 0; i < completions.length; i++) {
          if (langsSeen.indexOf(completions[i].lang_name) === -1) {
            langsSeen.push(completions[i].lang_name);
          }
        }

        // calculate average confidence rating
        var ratingsTotal = 0;
        var ratingsCount = 0;
        for (var i = 0; i < completions.length; i++) {
          if (completions[i].confidence_rating) {
            ratingsTotal += parseInt(completions[i].confidence_rating);
            ratingsCount++;
          }
        }

        // update summary bar numbers
        document.getElementById('total-completed').textContent = completions.length;
        document.getElementById('total-languages').textContent = langsSeen.length;
        if (ratingsCount > 0) {
          document.getElementById('avg-confidence').textContent = (ratingsTotal / ratingsCount).toFixed(1) + ' / 5';
        }

        // build the list of completed scenarios
        var html = '';
        for (var i = 0; i < completions.length; i++) {
          var c = completions[i];
          var dateStr = new Date(c.completed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          var ratingStr = c.confidence_rating ? 'Confidence: ' + c.confidence_rating + '/5' : 'No rating submitted';

          html += '<div class="progress-item">';
          html += '<span class="lang-chip">' + c.lang_name + '</span>';
          html += '<div style="flex: 1;">';
          html += '<div class="title">' + c.title + '</div>';
          html += '<div class="meta">';
          html += '<span class="difficulty-badge ' + c.difficulty.toLowerCase() + '" style="margin-right: 0.5rem;">' + c.difficulty + '</span>';
          html += 'Completed ' + dateStr + ' &middot; ' + ratingStr;
          html += '</div>';
          html += '</div>';
          html += '<a href="scenario.html?id=' + c.scenario_id + '" style="font-size: 0.82rem; color: var(--teal); text-decoration: none; white-space: nowrap;">Review &rarr;</a>';
          html += '</div>';
        }
        document.getElementById('progress-list').innerHTML = html;

      } catch (err) {
        document.getElementById('progress-list').innerHTML = '<p>Could not load progress. Is the backend running?</p>';
      }
    });
  </script>

</body>
</html>
