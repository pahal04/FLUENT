<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - FLUENT</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div class="header-stripe"></div>

  <nav>
    <a href="../index.html" class="nav-logo">FLUENT</a>
    <div class="nav-links">
      <!-- shows username when logged in (otherwise hidden) -->
      <span id="nav-user" class="hidden" style="color: var(--tan); font-size: 0.9rem;"></span>
      <a href="languages.html">Languages</a>
      <a id="nav-login" href="login.html">Log In</a>
      <a id="nav-register" href="register.html" class="btn-nav">Sign Up</a>
      <!-- logout shows only when logged in  -->
      <a id="nav-logout" href="#" class="hidden" onclick="logout()">Log Out</a>
    </div>
  </nav>

  <div class="form-card">
    <h2>Welcome back!</h2>
    <p class="subtitle">Log in to track your progress.</p>

    <!-- success/error message shows up here -->
    <div id="msg" class="msg hidden"></div>

    <div class="form-group">
      <label for="username">Username or Email</label>
      <input type="text" id="username" placeholder="Enter your username or email" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <!-- type="password" hides the characters -->
      <input type="password" id="password" placeholder="Your password" />
    </div>

    <!-- calls handleLogin function when its clicked -->
    <button class="btn btn-primary" style="width:100%; margin-top: 0.5rem;" onclick="handleLogin()">Log In</button>

    <p style="text-align:center; margin-top: 1rem; font-size: 0.88rem; color: var(--gray);">
      Don't have an account? <a href="register.html" style="color: var(--teal);">Sign up</a>
    </p>
  </div>

  <!-- JS used with all of the pages -->
  <script src="../js/app.js"></script>
  <script>
    async function handleLogin() {
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;

      if (!username || !password) {
        showMsg('msg', 'Please fill in both fields.', 'error');
        return;
      }

      try {
        const res = await fetch(API + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });

        const data = await res.json();

        if (!res.ok) {
          showMsg('msg', data.error || 'Login failed.', 'error');
          return;
        }

        setUser(data.user);
        // TODO: redirect to languages page instead?
        window.location.href = '../index.html';

      } catch (err) {
        showMsg('msg', 'Could not connect to server.', 'error');
      }
    }
  </script>

</body>
</html>
